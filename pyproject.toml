[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlongevity"
version = "0.2.0"
description = "Open-source computational infrastructure for aging and longevity research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ciprian Ștefan Pleșca"}]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy[asyncio]>=2.0"]

[project.scripts]
openlongevity = "openlongevity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
