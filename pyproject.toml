[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlongevity"
version = "0.3.0"
description = "Open-source computational infrastructure for aging and longevity research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ciprian Ștefan Pleșca"}]
dependencies = ["httpx>=0.28,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
db = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.16,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "types-defusedxml", "types-PyYAML", "PyYAML", "jsonschema"]

[project.scripts]
openlongevity = "openlongevity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openlongevity*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: isolated PostgreSQL integration (TEST_DATABASE_URL required)"]

[tool.mypy]
files = ["src/openlongevity"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["openlongevity.repository", "openlongevity.db", "openlongevity.providers.pubmed"]
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
