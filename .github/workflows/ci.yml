name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openlongevity
          POSTGRES_PASSWORD: openlongevity
          POSTGRES_DB: openlongevity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlongevity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://openlongevity:openlongevity@localhost:5432/openlongevity_test
      TEST_DATABASE_URL: postgresql+asyncpg://openlongevity:openlongevity@localhost:5432/openlongevity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -e ".[dev,api,db]"
      - run: alembic upgrade head
      - run: python scripts/seed_test_db.py
      - run: pytest --cov=openlongevity --cov-report=term-missing
      - run: ruff check .
      - run: python -m compileall src
