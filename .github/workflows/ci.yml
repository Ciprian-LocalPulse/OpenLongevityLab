name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e ".[dev,api,db]"
      - run: pytest --cov=openlongevity --cov-report=term-missing
      - run: ruff check .
      - run: python -m compileall src
